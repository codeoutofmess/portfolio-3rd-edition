<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'JetBrains Mono', monospace">
<rect width="760" height="290" fill="#0a0a0b"/>
<text x="40" y="34" fill="#f2f2f0" font-size="13">One patrol = 14 knife loops (117.6 s)</text>
<text x="40" y="52" fill="#8a8a8e" font-size="11">Every leg of the walk is a whole number of 8.4 s loops, so each turn lands on a loop boundary</text>
<line x1="40.0" y1="140" x2="185.7" y2="140" stroke="#6fe38a" stroke-width="4"/>
<line x1="185.7" y1="140" x2="191.5" y2="140" stroke="#f2f2f0" stroke-width="8"/>
<line x1="191.5" y1="140" x2="337.2" y2="140" stroke="#6fe38a" stroke-width="4"/>
<line x1="337.2" y1="140" x2="380.0" y2="140" stroke="#55555a" stroke-width="4" stroke-dasharray="4 4"/>
<line x1="380.0" y1="140" x2="525.7" y2="140" stroke="#6fe38a" stroke-width="4"/>
<line x1="525.7" y1="140" x2="531.5" y2="140" stroke="#f2f2f0" stroke-width="8"/>
