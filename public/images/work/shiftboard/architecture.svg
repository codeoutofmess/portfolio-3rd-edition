<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'JetBrains Mono', monospace">
  <rect width="760" height="260" fill="#0a0a0b"/>

  <!-- Browser -->
  <rect x="24" y="100" width="140" height="60" rx="6" fill="#111113" stroke="rgba(255,255,255,0.16)"/>
  <text x="94" y="126" fill="#f2f2f0" font-size="13" text-anchor="middle">Browser</text>
  <text x="94" y="144" fill="#8a8a8e" font-size="11" text-anchor="middle">HTTPS</text>

  <!-- arrow 1 -->
  <line x1="164" y1="130" x2="222" y2="130" stroke="#6fe38a" stroke-width="1.5"/>
  <polygon points="222,130 214,126 214,134" fill="#6fe38a"/>

  <!-- React frontend (Vercel) -->
  <rect x="226" y="90" width="180" height="80" rx="6" fill="#111113" stroke="rgba(255,255,255,0.16)"/>
  <text x="316" y="122" fill="#f2f2f0" font-size="13" text-anchor="middle">React + TS SPA</text>
  <text x="316" y="140" fill="#8a8a8e" font-size="11" text-anchor="middle">Vite build</text>
  <text x="316" y="158" fill="#6fe38a" font-size="11" text-anchor="middle">Vercel</text>

  <!-- arrow 2 -->
  <line x1="406" y1="130" x2="464" y2="130" stroke="#6fe38a" stroke-width="1.5"/>
  <polygon points="464,130 456,126 456,134" fill="#6fe38a"/>
  <text x="435" y="105" fill="#8a8a8e" font-size="10" text-anchor="middle">REST + JWT</text>

  <!-- API (Render, Docker) -->
  <rect x="468" y="80" width="190" height="100" rx="6" fill="#111113" stroke="rgba(255,255,255,0.16)"/>
  <text x="563" y="110" fill="#f2f2f0" font-size="13" text-anchor="middle">ASP.NET Core 8 API</text>
  <text x="563" y="128" fill="#8a8a8e" font-size="11" text-anchor="middle">multi-stage .NET Dockerfile</text>
  <text x="563" y="146" fill="#6fe38a" font-size="11" text-anchor="middle">Render (Blueprint)</text>
  <text x="563" y="164" fill="#8a8a8e" font-size="11" text-anchor="middle">auto-sync on push to main</text>

  <!-- arrow 3 down -->
  <line x1="563" y1="180" x2="563" y2="208" stroke="#6fe38a" stroke-width="1.5"/>
  <polygon points="563,208 559,200 567,200" fill="#6fe38a"/>
  <text x="620" y="197" fill="#8a8a8e" font-size="10" text-anchor="middle">EF Core</text>

  <!-- DB -->
  <rect x="468" y="212" width="190" height="40" rx="6" fill="#0d1f14" stroke="rgba(255,255,255,0.16)"/>
  <text x="563" y="237" fill="#f2f2f0" font-size="12" text-anchor="middle">SQLite — ephemeral disk</text>

  <!-- secret note -->
  <text x="94" y="185" fill="#55555a" font-size="10" text-anchor="middle">no shared host</text>
  <text x="94" y="200" fill="#55555a" font-size="10" text-anchor="middle">for both halves</text>
</svg>
